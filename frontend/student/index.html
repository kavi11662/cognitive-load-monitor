<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Cognitive Load Monitor</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7fb; color: #222; margin: 0; padding: 20px; }
        .card { background: white; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); padding: 20px; max-width: 760px; margin: auto; }
        h1 { margin-top: 0; }
        label, button { display: block; margin-top: 16px; }
        input { padding: 10px; width: 100%; max-width: 320px; }
        button { padding: 12px 18px; border: none; background: #0078d4; color: white; border-radius: 8px; cursor: pointer; }
        button:disabled { background: #aaa; }
        #video { width: 100%; max-width: 640px; border-radius: 12px; background: black; }
        #status { margin-top: 20px; font-size: 1.15rem; }
        .metric { margin: 6px 0; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Student Live Monitor</h1>
        <p>Enter your name, allow webcam, and your cognitive load signal will stream to the teacher dashboard.</p>
        <label for="nameInput">Student Name</label>
        <input id="nameInput" placeholder="Type your name" />
        <button id="startBtn">Start Monitor</button>
        <div id="studentArea" style="display:none;">
            <video id="video" autoplay muted playsinline></video>
            <div id="status"></div>
            <div class="metric" id="infoText"></div>
        </div>
    </div>

    <script src="student.js"></script>
</body>
</html>
